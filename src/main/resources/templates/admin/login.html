<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Login | Pushpendra Portfolio</title>
    <style>
        /* Global reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000, #1a1a1a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        /* Background gradient accents */
        .background-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: float 8s infinite ease-in-out;
        }

        .circle:nth-child(1) { width: 140px; height: 140px; top: 15%; left: 12%; animation-delay: 0s; }
        .circle:nth-child(2) { width: 220px; height: 220px; bottom: 12%; right: 8%; animation-delay: 2s; }
        .circle:nth-child(3) { width: 90px; height: 90px; top: 30%; right: 25%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }

        /* Login container */
        .login-container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            padding: 45px 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            width: 380px;
            text-align: center;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container h2 {
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #fff;
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            margin: 12px 0;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            transition: all 0.3s ease;
        }

        .login-container input:focus {
            border-color: #fff;
            box-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        .login-container input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .login-container button {
            background: linear-gradient(135deg, #ffffff, #cfcfcf);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .login-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255,255,255,0.25);
        }

        .error-msg {
            margin-top: 12px;
            font-size: 13px;
            color: #ff4b5c;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

<!-- Background shapes -->
<div class="background-shapes">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<!-- Login box -->
<div class="login-container">
    <h2>⚡ Admin Login</h2>
    <form th:action="@{/admin/login}" method="post">
        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />

        <!-- Error message -->
        <div th:if="${error}" class="error-msg">
            <p th:text="${error}"></p>
        </div>

        <button type="submit">Login</button>
    </form>

    <div class="footer-text">
        © 2025 Pushpendra Portfolio
    </div>
</div>

</body>
</html>
